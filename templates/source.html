<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Source</title>
<style>
  :root { --ink: #1a1a1a; --muted: #666; --line: #dcdcdc; --accent: #0b5cab; --bg: #f4f5f7; --card: #fff; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; margin: 0; color: var(--ink); background: var(--bg); }
  .global-header { display: flex; align-items: center; gap: 16px; padding: 8px 20px; min-height: 40px; background: #fff; border-bottom: 1px solid var(--line); }
  .global-header .brand { font-size: 13px; font-weight: 700; letter-spacing: 3px; color: var(--ink); }
  .global-nav { display: flex; gap: 6px; margin-left: 12px; }
  .global-nav .nav-link { text-decoration: none; color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 4px 12px; font-size: 12px; }
  .global-nav .nav-link:hover { border-color: var(--accent); color: var(--accent); }
  .global-nav .nav-link.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .topbar { display: flex; align-items: center; gap: 14px; padding: 8px 20px; min-height: 40px; background: #fff; border-bottom: 1px solid var(--line); }
  .topbar .title { font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: 2px; color: var(--muted); }
  .wrap { margin: 20px; padding: 0 20px; }
  .sheet { border-collapse: separate; border-spacing: 0; table-layout: fixed; width: 100%; border: 1px solid var(--line); background: var(--card); }
  .sheet th, .sheet td { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: middle; }
  .sheet thead th { background: #f4f5f7; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
  .btn { font: inherit; font-size: 12px; border: 1px solid var(--line); border-radius: 6px; background: #fff; padding: 4px 10px; cursor: pointer; }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  #status { font-size: 12px; color: var(--muted); margin-left: 12px; }
</style>
</head>
<body>
<header class="global-header">
  <div class="brand">Jobs</div>
  <nav class="global-nav">
    <a class="nav-link active" href="/source">Source</a>
    <a class="nav-link" href="/">Track Applications</a>
    <a class="nav-link" href="/apply">Draft Resumes</a>
    <a class="nav-link" href="/network">Draft Networking Messages</a>
  </nav>
</header>
<div class="topbar">
  <span class="title">Source</span>
  <span style="flex:1"></span>
  <span id="status"></span>
</div>
<div class="wrap">
  <table class="sheet" id="sourceGrid">
    <thead><tr><th style="width:80px">Add</th><th>Firm</th><th>Role</th><th>Deadline</th><th>Location</th></tr></thead>
    <tbody></tbody>
  </table>
</div>
<script>
  var statusEl = document.getElementById('status');
  function setStatus(msg) { statusEl.textContent = msg; }
  fetch('/source/data/opportunities.json').then(function (r) { return r.json(); }).then(function (data) {
    var tbody = document.querySelector('#sourceGrid tbody');
    data.forEach(function (row) {
      var tr = document.createElement('tr');
      var addTd = document.createElement('td');
      var btn = document.createElement('button');
      btn.className = 'btn primary';
      btn.textContent = 'Add';
      btn.addEventListener('click', function () {
        btn.disabled = true;
        setStatus('Adding ' + row.firm + '...');
        fetch('/source/add', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ firm: row.firm, title: row.title })
        }).then(function (r) { return r.json(); }).then(function (d) {
          if (d.ok) { setStatus('Added ' + row.firm); btn.textContent = 'Added'; }
          else { setStatus(d.error || 'Failed'); btn.disabled = false; }
        }).catch(function (e) { setStatus(e.message || 'Failed'); btn.disabled = false; });
      });
      addTd.appendChild(btn);
      tr.appendChild(addTd);
      tr.insertAdjacentHTML('beforeend', '<td>' + escapeHtml(row.firm) + '</td><td>' + escapeHtml(row.title) + '</td><td>' + escapeHtml(row.deadline || '') + '</td><td>' + escapeHtml(row.location || '') + '</td>');
      tbody.appendChild(tr);
    });
  }).catch(function (e) { setStatus(e.message || 'Load failed'); });
  function escapeHtml(s) { return String(s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
</script>
</body>
</html>
