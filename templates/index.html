<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resume Renderer</title>
<style>
  :root {
    --ink: #1a1a1a;
    --muted: #666;
    --line: #dcdcdc;
    --accent: #0b5cab;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 13px; margin: 0; color: var(--ink); background: #f4f5f7;
  }
  .global-header {
    display: flex; align-items: center; gap: 16px;
    padding: 8px 20px; min-height: 40px; background: #fff; border-bottom: 1px solid var(--line);
  }
  .global-header .brand { font-size: 13px; font-weight: 700; letter-spacing: 3px; color: var(--ink); }
  .global-nav { display: flex; gap: 6px; margin-left: 12px; }
  .global-nav .nav-link {
    text-decoration: none; color: var(--ink); background: #fff; border: 1px solid var(--line);
    border-radius: 6px; padding: 4px 12px; font-size: 12px;
  }
  .global-nav .nav-link:hover { border-color: var(--accent); color: var(--accent); }
  .global-nav .nav-link.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 14px; padding: 8px 20px; min-height: 40px; background: #fff; border-bottom: 1px solid var(--line);
  }
  .topbar .title { font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: 2px; color: var(--muted); }
  header h1 { font-size: 17px; margin: 0; }
  .wrap { max-width: 1100px; margin: 20px; padding: 0 20px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }
  .panel { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 14px; }
  .panel h2 { font-size: 14px; margin: 0 0 10px; }
  .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .panel-header h2 { margin: 0; }
  textarea {
    width: 100%; min-height: 560px; resize: vertical;
    font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px;
    border: 1px solid var(--line); border-radius: 6px; background: #fff; padding: 10px;
  }
  textarea.jd-input { min-height: 150px; }
  .actions { display: flex; gap: 8px; align-items: center; margin-top: 14px; }
  button {
    font: inherit; font-size: 13px; border: 1px solid var(--line); border-radius: 6px;
    background: #fff; padding: 8px 14px; cursor: pointer;
  }
  a.link-btn-blue,
  button.link-btn-blue {
    text-decoration: none; color: #fff; background: var(--accent);
    border: 1px solid var(--accent); border-radius: 6px;
    padding: 8px 14px; font-size: 13px; display: inline-block; white-space: nowrap;
  }
  a.link-btn-blue:hover, button.link-btn-blue:hover { filter: brightness(1.08); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.primary:hover { filter: brightness(1.08); }
  button:disabled { opacity: .55; cursor: default; }
  #status { font-size: 13px; color: var(--muted); }
  #status.error, #jd-status.error { color: #b42318; }
  #status.ok, #jd-status.ok { color: #067647; }
  #jd-status { font-size: 13px; color: var(--muted); }
  .hint { font-size: 12px; color: var(--muted); margin-top: 10px; }
  #preview { font-size: 12.5px; line-height: 1.5; max-height: 560px; overflow-y: auto; }
  .pv-section { margin-bottom: 14px; }
  .pv-heading { font-weight: 700; font-size: 13px; border-bottom: 1.5px solid var(--ink); padding-bottom: 2px; margin-bottom: 8px; }
  .pv-entry { margin-bottom: 10px; }
  .pv-org { display: flex; justify-content: space-between; gap: 8px; }
  .pv-loc { font-weight: 400; color: var(--muted); }
  .pv-dates { white-space: nowrap; }
  .pv-title { font-style: italic; }
  .pv-bullets { margin: 4px 0 0; padding-left: 16px; }
  .pv-bullets li { margin-bottom: 3px; }
  .pv-empty { color: var(--muted); font-style: italic; }
  .pv-block { border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-bottom: 12px; background: #fafafa; }
  .pv-block-title { font-weight: 700; font-size: 12px; letter-spacing: .04em; border-bottom: 1.5px solid var(--ink); padding-bottom: 4px; margin-bottom: 8px; }
  .pv-entry-block { border: 1px dashed var(--line); border-radius: 6px; padding: 8px; margin-bottom: 8px; background: #fff; }
  .pv-field { margin-bottom: 6px; }
  .pv-field label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 2px; }
  .pv-input { width: 100%; font: inherit; font-size: 12.5px; border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; background: #fff; }
  textarea.pv-input { min-height: 44px; resize: vertical; font-family: inherit; }
  .pv-bullet-row { display: flex; gap: 6px; align-items: flex-start; margin-bottom: 4px; }
  .pv-bullet-row textarea { flex: 1; }
  .pv-btn { font: inherit; font-size: 11px; border: 1px solid var(--line); border-radius: 4px; background: #fff; padding: 3px 8px; cursor: pointer; }
  .pv-btn:hover { background: #f0f0f0; }
  .toggle { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .toggle-btn {
    font: inherit; font-size: 13px; padding: 6px 14px; border: none;
    background: #fff; cursor: pointer; color: var(--ink);
  }
  .toggle-btn + .toggle-btn { border-left: 1px solid var(--line); }
  .toggle-btn.active { background: var(--accent); color: #fff; }
  .pv-recipient { margin-bottom: 14px; }
  .pv-body p { margin: 0 0 12px; }
  .pv-closing { margin-top: 12px; }
</style>
</head>
<body>
<header class="global-header">
  <div class="brand">Jobs</div>
  <nav class="global-nav">
    <a class="nav-link" href="/source">Source</a>
    <a class="nav-link" href="/">Track Applications</a>
    <a class="nav-link active" href="/apply">Draft Resumes</a>
    <a class="nav-link" href="/network">Draft Networking Messages</a>
  </nav>
</header>
<div class="topbar">
  <span class="title">Draft Resumes</span>
  <span style="flex:1"></span>
  <div class="toggle">
    <button class="toggle-btn active" data-mode="resume">Resume</button>
    <button class="toggle-btn" data-mode="cover_letter">Cover Letter</button>
  </div>
  <span style="font-size:12px;color:var(--muted);">JSON &rarr; PDF</span>
</div>
<div class="wrap">
  <div class="grid">
    <div class="panel">
      <div class="panel-header">
        <h2 id="editor-heading">Resume JSON</h2>
        <button id="copy-instructions" class="link-btn-blue copy-instructions-btn" type="button" data-endpoint="/instructions">Copy JSON creation instructions for your LLM</button>
        <button id="copy-cover-instructions" class="link-btn-blue copy-instructions-btn" type="button" data-endpoint="/cover-letter-instructions" style="display:none;">Copy cover letter instructions for your LLM</button>
      </div>
      <textarea id="content" spellcheck="false" placeholder='Paste your resume JSON here. Example: {"header": {"name": "Your Name", ...}, "education": [...], "experience": [...], ...}'></textarea>
      <div class="actions">
        <button id="format">Format JSON</button>
        <button id="clear">Clear</button>
        <span style="flex:1"></span>
        <span id="status"></span>
        <button id="generate" class="primary">Generate PDF</button>
      </div>
      <p class="hint">Filename is derived from <code>header.name</code> and <code>output.company</code> in the format: LastName_FirstName_Resume_MM_DD_CompanyName.pdf</p>
    </div>
    <div class="panel">
      <h2>Preview</h2>
      <div id="preview"></div>
    </div>
  </div>
</div>
<script>
(function () {
  var contentEl = document.getElementById('content');
  var previewEl = document.getElementById('preview');
  var statusEl = document.getElementById('status');
  var generateBtn = document.getElementById('generate');
  var mode = 'resume';
  var currentData = null;
  var isSyncingFromBlocks = false;
  var textareaTimer = null;

  var RESUME_PLACEHOLDER = 'Paste your resume JSON here. Example: {"header": {"name": "Your Name", ...}, "education": [...], "experience": [...], ...}';
  var COVER_PLACEHOLDER = 'Paste your cover letter JSON here. Example: {"header": {"name": "Your Name", ...}, "recipient": {...}, "body": [...], ...}';

  var SECTIONS_BY_KEY = {
    education:   { title: 'EDUCATION', kind: 'entries', org: 'institution', titleField: 'degree', bullets: 'details', dates: 'date' },
    experience:  { title: 'EXPERIENCE', kind: 'entries', org: 'company', titleField: 'title', bullets: 'bullets', dates: 'dates' },
    leadership:  { title: 'LEADERSHIP AND COMMUNITY INVOLVEMENT', kind: 'entries', org: 'organization', titleField: 'title', bullets: 'bullets', dates: 'dates' },
    additional:  { title: 'ADDITIONAL INFORMATION', kind: 'bullets' }
  };

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function escapeAttr(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
  }

  function parsePath(p) {
    return String(p).split('.').map(function (t) { return /^\d+$/.test(t) ? parseInt(t, 10) : t; });
  }

  function setValue(root, path, val) {
    var cur = root;
    for (var i = 0; i < path.length - 1; i++) {
      var key = path[i];
      if (cur[key] == null) {
        cur[key] = (typeof path[i + 1] === 'number') ? [] : {};
      }
      cur = cur[key];
    }
    cur[path[path.length - 1]] = val;
  }

  function renderObjectBlock(key, title, obj, fields) {
    var fs = fields || Object.keys(obj || {});
    var h = '<div class="pv-block" data-block="' + escapeAttr(key) + '"><div class="pv-block-title">' + escapeHtml(title) + '</div>';
    fs.forEach(function (f) {
      var path = key + '.' + f;
      var v = (obj || {})[f];
      if (typeof v === 'boolean') {
        h += '<div class="pv-field"><label><input type="checkbox" data-path="' + escapeAttr(path) + '"' + (v ? ' checked' : '') + '> ' + escapeHtml(f) + '</label></div>';
      } else {
        h += '<div class="pv-field"><label>' + escapeHtml(f) + '<input class="pv-input" data-path="' + escapeAttr(path) + '" value="' + escapeAttr(v) + '"></label></div>';
      }
    });
    return h + '</div>';
  }

  function renderEntriesSectionBlock(key, title, arr, spec) {
    var h = '<div class="pv-block" data-block="' + escapeAttr(key) + '"><div class="pv-block-title">' + escapeHtml(title) + '</div>';
    (arr || []).forEach(function (e, i) {
      h += '<div class="pv-entry-block">';
      var scalarFields = Object.keys(e || {}).filter(function (k) { return !Array.isArray((e || {})[k]); });
      var arrayFields = Object.keys(e || {}).filter(function (k) { return Array.isArray((e || {})[k]); });
      scalarFields.forEach(function (f) {
        var path = key + '.' + i + '.' + f;
        var v = e[f];
        if (typeof v === 'boolean') {
          h += '<div class="pv-field"><label><input type="checkbox" data-path="' + escapeAttr(path) + '"' + (v ? ' checked' : '') + '> ' + escapeHtml(f) + '</label></div>';
        } else {
          h += '<div class="pv-field"><label>' + escapeHtml(f) + '<input class="pv-input" data-path="' + escapeAttr(path) + '" value="' + escapeAttr(v) + '"></label></div>';
        }
      });
      arrayFields.forEach(function (f) {
        var path = key + '.' + i + '.' + f;
        h += '<div class="pv-field"><label>' + escapeHtml(f) + '</label>';
        (e[f] || []).forEach(function (b, j) {
          h += '<div class="pv-bullet-row"><textarea class="pv-input" data-path="' + escapeAttr(path + '.' + j) + '">' + escapeHtml(b) + '</textarea><button class="pv-btn" data-action="remove" data-path="' + escapeAttr(path) + '" data-index="' + j + '">×</button></div>';
        });
        h += '<button class="pv-btn" data-action="add-bullet" data-path="' + escapeAttr(path) + '">+ bullet</button></div>';
      });
      h += '<button class="pv-btn" data-action="remove-entry" data-section="' + escapeAttr(key) + '" data-index="' + i + '">Remove entry</button>';
      h += '</div>';
    });
    h += '<button class="pv-btn" data-action="add-entry" data-section="' + escapeAttr(key) + '">+ entry</button>';
    return h + '</div>';
  }

  function renderBulletsSectionBlock(key, title, val) {
    var bullets = (val && Array.isArray(val)) ? val : ((val && val.bullets) ? val.bullets : []);
    var basePath = (val && Array.isArray(val)) ? key : (key + '.bullets');
    var h = '<div class="pv-block" data-block="' + escapeAttr(key) + '"><div class="pv-block-title">' + escapeHtml(title) + '</div>';
    h += '<div class="pv-field">';
    bullets.forEach(function (b, i) {
      h += '<div class="pv-bullet-row"><textarea class="pv-input" data-path="' + escapeAttr(basePath + '.' + i) + '">' + escapeHtml(b) + '</textarea><button class="pv-btn" data-action="remove" data-path="' + escapeAttr(basePath) + '" data-index="' + i + '">×</button></div>';
    });
    h += '<button class="pv-btn" data-action="add-bullet" data-path="' + escapeAttr(basePath) + '">+ bullet</button>';
    return h + '</div></div>';
  }

  function renderScalarBlock(key, title, value) {
    return '<div class="pv-block" data-block="' + escapeAttr(key) + '"><div class="pv-block-title">' + escapeHtml(title) + '</div><textarea class="pv-input" data-path="' + escapeAttr(key) + '">' + escapeHtml(value == null ? '' : value) + '</textarea></div>';
  }

  function renderSectionTitlesBlock(obj) {
    var h = '<div class="pv-block" data-block="section_titles"><div class="pv-block-title">SECTION TITLES</div>';
    Object.keys(obj || {}).forEach(function (k) {
      h += '<div class="pv-field"><label>' + escapeHtml(k) + '<input class="pv-input" data-path="section_titles.' + escapeAttr(k) + '" value="' + escapeAttr(obj[k]) + '"></label></div>';
    });
    return h + '</div>';
  }

  function renderResumeBlocks(data) {
    var titles = (data && data.section_titles) || {};
    var html = '';
    Object.keys(data || {}).forEach(function (key) {
      var val = data[key];
      if (key === 'header') {
        html += renderObjectBlock('header', titles.header || 'HEADER', val, ['name', 'contact', 'email', 'linkedin']);
      } else if (key === 'output') {
        html += renderObjectBlock('output', 'OUTPUT (filename)', val, ['company']);
      } else if (key === 'section_titles') {
        html += renderSectionTitlesBlock(val);
      } else if (SECTIONS_BY_KEY[key]) {
        var spec = SECTIONS_BY_KEY[key];
        if (spec.kind === 'bullets') {
          html += renderBulletsSectionBlock(key, titles[key] || spec.title, val);
        } else {
          html += renderEntriesSectionBlock(key, titles[key] || spec.title, val, spec);
        }
      } else {
        if (Array.isArray(val)) {
          html += renderEntriesSectionBlock(key, (titles[key] || key.toUpperCase()), val, {});
        } else if (val && typeof val === 'object') {
          html += renderObjectBlock(key, (titles[key] || key.toUpperCase()), val, Object.keys(val));
        } else {
          html += renderScalarBlock(key, (titles[key] || key.toUpperCase()), val);
        }
      }
    });
    return html || '<div class="pv-empty">No sections found.</div>';
  }

  function renderCoverBlocks(data) {
    var html = '';
    if (data && data.header) html += renderObjectBlock('header', 'HEADER', data.header, ['name', 'contact', 'email', 'linkedin']);
    if (data && data.date !== undefined) html += renderScalarBlock('date', 'DATE', data.date);
    if (data && data.recipient) html += renderObjectBlock('recipient', 'RECIPIENT', data.recipient, ['name', 'title', 'company', 'address']);
    if (data && data.greeting !== undefined) html += renderScalarBlock('greeting', 'GREETING', data.greeting);
    if (data && Array.isArray(data.body)) html += renderBulletsSectionBlock('body', 'BODY', data.body);
    if (data && data.closing !== undefined) html += renderScalarBlock('closing', 'CLOSING', data.closing);
    Object.keys(data || {}).forEach(function (key) {
      if (['header','date','recipient','greeting','body','closing'].indexOf(key) !== -1) return;
      var val = data[key];
      if (Array.isArray(val)) html += renderEntriesSectionBlock(key, key.toUpperCase(), val, {});
      else if (val && typeof val === 'object') html += renderObjectBlock(key, key.toUpperCase(), val, Object.keys(val));
      else html += renderScalarBlock(key, key.toUpperCase(), val);
    });
    return html || '<div class="pv-empty">No sections found.</div>';
  }

  function syncToTextarea() {
    if (!currentData) return;
    isSyncingFromBlocks = true;
    contentEl.value = JSON.stringify(currentData, null, 2);
    isSyncingFromBlocks = false;
  }

  function renderAllBlocks() {
    if (!currentData) {
      if (!contentEl.value.trim()) {
        previewEl.innerHTML = '<div class="pv-empty">Paste JSON on the left to preview.</div>';
        return;
      }
      try {
        currentData = JSON.parse(contentEl.value);
        renderAllBlocks();
      } catch (e) {
        previewEl.innerHTML = '<div class="pv-empty">Invalid JSON \u2014 fix to preview.</div>';
      }
      return;
    }
    if (mode === 'cover_letter') {
      previewEl.innerHTML = renderCoverBlocks(currentData);
    } else {
      previewEl.innerHTML = renderResumeBlocks(currentData);
    }
    attachBlockListeners();
  }

  function attachBlockListeners() {
    previewEl.querySelectorAll('[data-path]').forEach(function (el) {
      var handler = function () {
        var path = parsePath(el.getAttribute('data-path'));
        var val = (el.type === 'checkbox') ? el.checked : el.value;
        setValue(currentData, path, val);
        syncToTextarea();
      };
      el.addEventListener('input', handler);
      if (el.type === 'checkbox') el.addEventListener('change', handler);
    });
  }

  function handleBlockAction(e) {
    var btn = (e.target && e.target.closest) ? e.target.closest('[data-action]') : null;
    if (!btn) return;
    var action = btn.getAttribute('data-action');
    if (action === 'remove') {
      var path = parsePath(btn.getAttribute('data-path'));
      var idx = parseInt(btn.getAttribute('data-index'), 10);
      var arr = currentData;
      for (var i = 0; i < path.length; i++) arr = arr[path[i]];
      if (Array.isArray(arr)) { arr.splice(idx, 1); syncToTextarea(); renderAllBlocks(); }
    } else if (action === 'add-bullet') {
      var p = parsePath(btn.getAttribute('data-path'));
      var arr2 = currentData;
      for (var j = 0; j < p.length; j++) arr2 = arr2[p[j]];
      if (!Array.isArray(arr2)) {
        setValue(currentData, p, []);
        arr2 = currentData;
        for (var k = 0; k < p.length; k++) arr2 = arr2[p[k]];
      }
      arr2.push('');
      syncToTextarea();
      renderAllBlocks();
    } else if (action === 'remove-entry') {
      var section = btn.getAttribute('data-section');
      var idx2 = parseInt(btn.getAttribute('data-index'), 10);
      if (Array.isArray(currentData[section])) {
        currentData[section].splice(idx2, 1);
        syncToTextarea();
        renderAllBlocks();
      }
    } else if (action === 'add-entry') {
      var section2 = btn.getAttribute('data-section');
      var def = {};
      if (section2 === 'education') def = { institution: '', location: '', date: '', degree: '', details: [] };
      else if (section2 === 'experience') def = { company: '', location: '', dates: '', title: '', bullets: [] };
      else if (section2 === 'leadership') def = { organization: '', location: '', dates: '', title: '', bullets: [] };
      else def = {};
      if (!Array.isArray(currentData[section2])) currentData[section2] = [];
      currentData[section2].push(def);
      syncToTextarea();
      renderAllBlocks();
    }
  }

  previewEl.addEventListener('click', handleBlockAction);

  function updatePreview() {
    renderAllBlocks();
  }

  function debounce(fn, ms) {
    var t;
    return function () { clearTimeout(t); t = setTimeout(fn, ms); };
  }

  function setStatus(msg, cls) {
    statusEl.textContent = msg;
    statusEl.className = cls || '';
  }

  function parseContent() {
    try {
      return JSON.parse(contentEl.value);
    } catch (e) {
      setStatus('Invalid JSON: ' + e.message, 'error');
      return null;
    }
  }

  contentEl.addEventListener('input', function () {
    if (isSyncingFromBlocks) return;
    clearTimeout(textareaTimer);
    textareaTimer = setTimeout(function () {
      if (!contentEl.value.trim()) { currentData = null; previewEl.innerHTML = '<div class="pv-empty">Paste JSON on the left to preview.</div>'; return; }
      try {
        currentData = JSON.parse(contentEl.value);
        renderAllBlocks();
      } catch (e) {
        previewEl.innerHTML = '<div class="pv-empty">Invalid JSON \\u2014 fix to preview.</div>';
      }
    }, 250);
  });
  // initial
  if (contentEl.value.trim()) {
    try { currentData = JSON.parse(contentEl.value); } catch (e) { currentData = null; }
  }
  renderAllBlocks();

  function setMode(newMode, clearContent) {
    if (clearContent !== false) clearContent = true;
    document.querySelector('.toggle-btn.active').classList.remove('active');
    document.querySelector('.toggle-btn[data-mode="' + newMode + '"]').classList.add('active');
    mode = newMode;
    if (clearContent) { contentEl.value = ''; currentData = null; }
    contentEl.placeholder = mode === 'cover_letter' ? COVER_PLACEHOLDER : RESUME_PLACEHOLDER;
    document.getElementById('editor-heading').textContent = mode === 'cover_letter' ? 'Cover Letter JSON' : 'Resume JSON';
    document.getElementById('copy-instructions').style.display = mode === 'cover_letter' ? 'none' : '';
    document.getElementById('copy-cover-instructions').style.display = mode === 'cover_letter' ? '' : 'none';
    renderAllBlocks();
    setStatus('');
  }

  document.querySelectorAll('.toggle-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      setMode(btn.dataset.mode, true);
    });
  });

  document.getElementById('format').addEventListener('click', function () {
    var parsed = parseContent();
    if (parsed) { currentData = parsed; contentEl.value = JSON.stringify(parsed, null, 2); setStatus('Formatted'); renderAllBlocks(); }
  });

  document.getElementById('clear').addEventListener('click', function () {
    contentEl.value = '';
    currentData = null;
    setStatus('');
    renderAllBlocks();
    contentEl.focus();
  });

  document.querySelectorAll('.copy-instructions-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var original = btn.textContent;
      btn.disabled = true;
      fetch(btn.dataset.endpoint).then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.text();
      }).then(function (text) {
        return navigator.clipboard.writeText(text);
      }).then(function () {
        btn.textContent = 'Copied to clipboard';
        setStatus('Instructions copied to clipboard', 'ok');
        setTimeout(function () { btn.textContent = original; }, 1500);
      }).catch(function (e) {
        setStatus(e.message || 'Copy failed', 'error');
      }).finally(function () {
        btn.disabled = false;
      });
    });
  });

  generateBtn.addEventListener('click', function () {
    var parsed = parseContent();
    if (!parsed) return;
    generateBtn.disabled = true;
    setStatus('Rendering...');
    fetch('/render', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content: parsed })
    }).then(function (r) {
      if (!r.ok) {
        return r.json().then(function (d) {
          throw new Error((d && d.error) || ('HTTP ' + r.status));
        });
      }
      var cd = r.headers.get('Content-Disposition') || '';
      var m = /filename="?([^";]+)"?/.exec(cd);
      var filename = m ? m[1] : 'resume.pdf';
      return r.blob().then(function (blob) {
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url; a.download = filename;
        document.body.appendChild(a); a.click(); a.remove();
        URL.revokeObjectURL(url);
        setStatus('Downloaded ' + filename, 'ok');
      });
    }).catch(function (e) {
      setStatus(e.message, 'error');
    }).finally(function () {
      generateBtn.disabled = false;
    });
  });
})();
</script>
</body>
</html>
